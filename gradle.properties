org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.java.installations.auto-download=false
kotlin.code.style=official

# Minecraft 1.20.1 NeoForge is a Forge-compatible loader (net.minecraftforge.*).
# The public NeoForge 1.20.1 installer was withdrawn; Create 6.0.8 and this compat
# use the same jar on Forge 47.x and NeoForge 20.1.x. Porting to 1.21.1 will switch
# to NeoForge packages, neoforge.mods.toml, and Kotlin for Forge 5.x.
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.16
forge_version_range=[47,)
loader_version_range=[4.10,)

mapping_channel=official
mapping_version=1.20.1

kff_version=4.12.0
create_version=6.0.8-289
ponder_version=1.0.91
flywheel_version=1.0.5
registrate_version=MC1.20-1.3.3
mixin_extras_version=0.4.1
geckolib_version=4.4.9
hamsters_version=1.20.1-1.0.3

mod_id=hamsterscreatecompat
mod_name=Create: Hamsters Compat
mod_version=1.0.0
mod_group_id=com.hamsterscreate.compat
mod_authors=Hamsters Create Compat contributors
mod_description=Connects Hamsters wheels to Create shafts, lets you insert and take hamsters from a wheel, and awards Exploitation... the first time a hamster turns a shaft.
mod_license=MPL-2.0
