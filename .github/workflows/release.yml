name: Release

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

# Пуш в main (и тег / ручной запуск) пересобирает мод и обновляет
# GitHub Release для текущей mod_version: те же jar перезаписываются.
# Новый номер версии в gradle.properties → новый релиз vX.Y.Z.
# SHA-256 у каждого файла считает сам GitHub при загрузке.

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Read versions from gradle.properties
        id: versions
        run: |
          set -euo pipefail
          mod_version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          minecraft_version="$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          kff_version="$(grep -E '^kff_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          create_version="$(grep -E '^create_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          hamsters_version="$(grep -E '^hamsters_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          geckolib_version="$(grep -E '^geckolib_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          echo "mod_version=${mod_version}" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=${minecraft_version}" >> "$GITHUB_OUTPUT"
          echo "kff_version=${kff_version}" >> "$GITHUB_OUTPUT"
          echo "create_version=${create_version}" >> "$GITHUB_OUTPUT"
          echo "hamsters_version=${hamsters_version}" >> "$GITHUB_OUTPUT"
          echo "geckolib_version=${geckolib_version}" >> "$GITHUB_OUTPUT"
          echo "mod_version=${mod_version}" >> "$GITHUB_ENV"

      - name: Check tag matches mod_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          expected="v${{ steps.versions.outputs.mod_version }}"
          actual="${GITHUB_REF_NAME}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Tag ${actual} must be ${expected} (mod_version in gradle.properties)."
            exit 1
          fi

      - name: Point version tag at this commit
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          tag="v${{ steps.versions.outputs.mod_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${tag}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${tag}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew -b logic.gradle test --stacktrace

      - name: Build remapped jar
        run: ./gradlew reobfJar collectReleaseArtifacts --stacktrace

      - name: Collect release jars
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          jars=(build/release/*.jar)
          if [[ ${#jars[@]} -eq 0 ]]; then
            echo "No jars in build/release"
            exit 1
          fi
          for jar in "${jars[@]}"; do
            case "${jar}" in
              *-sources.jar|*-javadoc.jar) continue ;;
              *) cp -v "${jar}" release-assets/ ;;
            esac
          done
          test -f "release-assets/hamsterscreatecompat-${{ steps.versions.outputs.minecraft_version }}-${{ steps.versions.outputs.mod_version }}.jar"
          ls -lh release-assets

      - name: Remove stale GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ steps.versions.outputs.mod_version }}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            echo "No existing release ${tag}"
            exit 0
          fi
          mapfile -t existing < <(gh release view "${tag}" --json assets --jq '.assets[].name')
          for name in "${existing[@]}"; do
            if [[ ! -f "release-assets/${name}" ]]; then
              echo "Deleting stale asset ${name}"
              gh release delete-asset "${tag}" "${name}" --yes
            fi
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versions.outputs.mod_version }}
          name: Create: Hamsters Compat ${{ steps.versions.outputs.mod_version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/hamsterscreatecompat-*.jar
            release-assets/create-*.jar
            release-assets/hamsters-*.jar
            release-assets/kotlinforforge-*.jar
            release-assets/geckolib-*.jar
          body: |
            Minecraft **1.20.1** / Forge 47 or NeoForge 20.1. Put the jars you need into the `mods` folder.

            | File | Required | Source |
            | --- | --- | --- |
            | `hamsterscreatecompat-${{ steps.versions.outputs.minecraft_version }}-${{ steps.versions.outputs.mod_version }}.jar` | Yes | this compat |
            | `create-1.20.1-6.0.8.jar` | Yes | [Create](https://modrinth.com/mod/create) |
            | `hamsters-forge-1.0.3-1.20.1.jar` | Yes | [Hamsters](https://modrinth.com/mod/hamsters) |
            | `kotlinforforge-${{ steps.versions.outputs.kff_version }}-all.jar` | Yes | [Kotlin for Forge](https://modrinth.com/mod/kotlin-for-forge) (LGPL-2.1) |
            | `geckolib-forge-1.20.1-${{ steps.versions.outputs.geckolib_version }}.jar` | Yes (for Hamsters) | [GeckoLib](https://modrinth.com/mod/geckolib) (MIT) |

            Do not install `*-sources.jar`. Companion jars are official builds, rehosted here for a one-page install. GitHub shows a SHA-256 digest next to each uploaded file.

      - name: Check Modrinth token
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${MODRINTH_TOKEN}" ]]; then
            echo "Secret MODRINTH_TOKEN is missing or empty on this repository."
            echo "GitHub → Settings → Secrets and variables → Actions → New repository secret."
            echo "Name must be exactly MODRINTH_TOKEN. Without it mc-publish skips Modrinth and still exits 0."
            exit 1
          fi

      - name: Publish Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: hamsters-create-compat
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          name: ${{ steps.versions.outputs.mod_version }}
          version: ${{ steps.versions.outputs.mod_version }}
          version-type: release
          changelog: |
            Minecraft 1.20.1 / Forge 47 or NeoForge 20.1. Create: Hamsters Compat ${{ steps.versions.outputs.mod_version }}.
          loaders: |
            neoforge
          game-versions: |
            1.20.1
          java: |
            17
          files: release-assets/hamsterscreatecompat-*.jar
          dependencies: |
            create(required){modrinth:LNytGWDc}
            hamsters(required){modrinth:sRzS8pFG}
            kotlin-for-forge(required){modrinth:ordsPcFz}
            geckolib(required){modrinth:8BmcQJ2H}
