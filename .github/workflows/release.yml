name: Build and release

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew -b logic.gradle test --stacktrace

      - name: Build remapped jar
        run: ./gradlew build collectReleaseArtifacts --stacktrace

      - name: Prepare release notes
        id: meta
        run: |
          sha="${GITHUB_SHA}"
          short="${sha:0:7}"
          echo "tag=build-${{ github.run_number }}-${short}" >> "$GITHUB_OUTPUT"
          echo "title=Build ${{ github.run_number }} (${short})" >> "$GITHUB_OUTPUT"
          {
            echo 'notes<<EOF'
            echo "Automatic build from \`${sha}\` on \`${{ github.ref_name }}\`."
            echo
            echo "Each attached \`.jar\` shows a SHA-256 digest on this GitHub Release page."
            echo
            echo "Included dependency jars: Create, Hamsters, Kotlin for Forge, GeckoLib."
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body: ${{ steps.meta.outputs.notes }}
          prerelease: true
          files: build/release/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
