name: Build and release

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew -b logic.gradle test --stacktrace

      - name: Build remapped jar
        run: ./gradlew reobfJar collectReleaseArtifacts --stacktrace

      - name: Prepare release notes
        id: meta
        run: |
          sha="${GITHUB_SHA}"
          short="${sha:0:7}"
          version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          echo "tag=build-${{ github.run_number }}-${short}" >> "$GITHUB_OUTPUT"
          echo "title=Build ${{ github.run_number }} (${short})" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          {
            echo 'notes<<EOF'
            echo "Automatic build from \`${sha}\` on \`${{ github.ref_name }}\`."
            echo
            echo "Each attached \`.jar\` shows a SHA-256 digest on this GitHub Release page."
            echo
            echo "Included dependency jars: Create, Hamsters, Kotlin for Forge, GeckoLib."
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body: ${{ steps.meta.outputs.notes }}
          prerelease: true
          files: build/release/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: hamsters-create-compat
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          name: ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          version-type: release
          changelog: ${{ steps.meta.outputs.notes }}
          loaders: |
            neoforge
          game-versions: |
            1.20.1
          java: |
            17
          files: build/release/hamsterscreatecompat-*.jar
          dependencies: |
            create(required){modrinth:LNytGWDc}
            hamsters(required){modrinth:sRzS8pFG}
            kotlin-for-forge(required){modrinth:ordsPcFz}
            geckolib(required){modrinth:8BmcQJ2H}
