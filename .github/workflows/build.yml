name: Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew -b logic.gradle test --stacktrace

      - name: Build remapped jar
        run: ./gradlew reobfJar --stacktrace

      - name: Upload mod jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamsterscreatecompat-jar
          path: build/libs/*.jar
          if-no-files-found: error
